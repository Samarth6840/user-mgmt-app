version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: user_mgmt
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=user_mgmt;Username=postgres;Password=12345678;"
      Jwt__Secret: "REPLACE_WITH_A_32_CHAR_BASE64_SECRET"
      Jwt__Issuer: "user-mgmt-api"
      Jwt__Audience: "user-mgmt-client"
      Smtp__Host: "smtp.gmail.com"
      Smtp__Port: "587"
      Smtp__User: "your-email@gmail.com"
      Smtp__Password: "your-app-password"
      App__PublicUrl: "http://localhost:5173"
      App__CorsOrigins: "http://localhost:5173"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8080/api"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  db_data:
